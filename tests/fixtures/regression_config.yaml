  source_timezone: UTC
  market_timezone: Asia/Kolkata
  start_date: '2025-06-13'
  end_date: '2026-06-13'
  columns:
    open: open
    high: high
    low: low
    close: close
    volume: volume
backtest:
  cash: 100000
  commission: 0
  trade_on_close: false
  exclusive_orders: false
  finalize_trades: true
strategy:
  name: traffic_light
trading:
  trading_start_time: 09:15
  trading_end_time: '13:00'
  force_square_off: true
  square_off_time: '15:15'
  max_trades_per_day: 3
  stop_after_first_profit: true
risk:
  position_size:
    value: 1
  stop_loss:
    method: fixed_or_signal_candle_tighter
